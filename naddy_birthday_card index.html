<style>
  :root{
    --kraft:#c7a874;
    --kraft-dark:#a98a58;
    --cream:#fdfbf3;
    --ink:#4a3728;
    --red:#8b2635;
    --olive:#767b39;
    --olive-dark:#5c6129;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.06), transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 4px),
      var(--kraft);
    background-color:var(--kraft);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --kraft:#8a7148; }
  }
  :root[data-theme="dark"]{ --kraft:#8a7148; }

  .stage{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:8vh 16px 40px;
  }

  h1.title{
    font-family:'Caveat', cursive;
    font-size:clamp(28px,5vw,42px);
    color:var(--cream);
    text-shadow:0 2px 6px rgba(0,0,0,0.25);
    margin:0 0 22px;
    text-align:center;
    letter-spacing:0.5px;
  }

    border-radius:6px;

  }
  .cover:hover{ transform:translateY(-3px) rotate(-0.4deg); box-shadow:0 22px 48px rgba(0,0,0,0.4); }
  .cover:active{ transform:translateY(0) scale(0.99); }
  .tap-hint{
    margin-top:14px;
    color:var(--cream);
    font-family:'Patrick Hand',cursive;
    font-size:15px;
    opacity:.85;
    text-align:center;
  }

  /* ---------- BOOK ---------- */
  #book{
    display:none;
    width:min(90vw, 480px);
    perspective:2400px;
  }
  #book.open{ display:block; }

  .spread{
    display:flex;
    flex-direction:column;
    width:100%;
    background:var(--olive-dark);
    border-radius:8px;
    box-shadow:0 24px 55px rgba(0,0,0,0.4);
    overflow:visible;
    position:relative;
  }
  .page{
    width:100%;
    aspect-ratio:900/636;
    position:relative;
    overflow:hidden;
    background-size:cover;
    background-position:center;
  }

  .spine{
    position:absolute;
    top:calc(50% - 3px);
    left:0; right:0;
    height:6px;
    background:linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.05), rgba(0,0,0,0.35));
    z-index:5;
    pointer-events:none;
    border-radius:3px;
  }
  @keyframes openTop{
    from{ transform:rotateX(-92deg); opacity:0; }
    to{ transform:rotateX(0deg); opacity:1; }
  }
  @keyframes openBottom{
    from{ transform:rotateX(92deg); opacity:0; }
    to{ transform:rotateX(0deg); opacity:1; }
  }

  /* Letter / envelope */
  .letter-btn{
    position:absolute;
    left:26%; top:20%;
    width:48%; height:19%;
    border:none;
    background:transparent;
    padding:0; margin:0;
    overflow:hidden;
    cursor:pointer;
    z-index:4;
    transform:rotate(-1deg);
    transition:left .5s cubic-bezier(.2,.8,.3,1), top .5s cubic-bezier(.2,.8,.3,1),
               width .5s cubic-bezier(.2,.8,.3,1), height .5s cubic-bezier(.2,.8,.3,1),
               transform .5s cubic-bezier(.2,.8,.3,1);
  }
  .letter-btn img{
    position:absolute;
    left:0; top:0;
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    pointer-events:none;
  }
  .letter-btn.up{
    left:8%; top:12%;
    width:80%; height:80%;
    overflow:visible;
    z-index:7;
    transform:rotate(-0.4deg);
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .letter-btn.up img{
    position:static;
    width:auto;
    height:auto;
    max-width:100%;
    max-height:100%;
    filter:drop-shadow(0 14px 28px rgba(0,0,0,0.4));
  }
  .letter-hint{
    position:absolute;
    bottom:6px; left:0; right:0;
    text-align:center;
    font-family:'Patrick Hand',cursive;
    font-size:13px;
    color:var(--cream);
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
    pointer-events:none;
  }

  /* Candles page */
  .flame{
    position:absolute;
    transform-origin:50% 90%;
    filter:drop-shadow(0 0 6px rgba(255,180,60,0.55));
    transition:opacity .35s ease;
    will-change:transform;
  }
  .flame.out{ opacity:0; }
  #f1{ left:40.45%; top:29.6%; width:3.6%; }
  #f2{ left:50.6%;  top:26.9%; width:5.6%; }
  #f3{ left:60.1%;  top:28.5%; width:5.3%; }

  .meter-wrap{
    position:absolute;
    left:50%; bottom:6%;
    transform:translateX(-50%);
    width:70%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .meter-track{
    width:100%; height:8px;
    background:rgba(255,255,255,0.35);
    border-radius:6px;
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.3);
  }
  .meter-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,#f6c453,#e8743b);
    transition:width .06s linear;
  }
  .mic-label{
    font-family:'Patrick Hand',cursive;
    font-size:12px;
    color:#4a3728;
    background:rgba(255,255,255,0.55);
    padding:2px 10px;
    border-radius:10px;
  }
  .blow-btn{
    margin-top:4px;
    font-family:'Patrick Hand',cursive;
    font-size:14px;
    padding:7px 16px;
    border-radius:20px;
    border:2px solid var(--red);
    background:var(--cream);
    color:var(--red);
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
  }
  .blow-btn:active{ background:var(--red); color:var(--cream); }

  .wish-overlay{
    position:absolute; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(253,251,243,0.88);
    border-radius:0 8px 8px 0;
    text-align:center;
    padding:6%;
    z-index:8;
  }
  .wish-overlay.show{ display:flex; }
  .wish-overlay p{
    font-family:'Caveat',cursive;
    font-size:clamp(22px,4vw,34px);
    color:var(--red);
    margin:0 0 14px;
  }
  .relight-btn{
    font-family:'Patrick Hand',cursive;
    font-size:14px;
    padding:8px 18px;
    border-radius:20px;
    border:2px solid var(--olive);
    background:var(--cream);
    color:var(--olive-dark);
    cursor:pointer;
  }

  canvas#confetti{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:9;
  }

  /* Back to cover */
  #backBtn{
    display:none;
    margin-top:22px;
    font-family:'Patrick Hand',cursive;
    font-size:15px;
    padding:9px 20px;
    border-radius:22px;
    border:2px solid var(--cream);
    background:transparent;
    color:var(--cream);
    cursor:pointer;
  }
  #backBtn.show{ display:inline-block; }
  #backBtn:hover{ background:rgba(255,255,255,0.15); }

  .https-note{
    max-width:520px;
    margin-top:18px;
    font-size:12px;
    color:var(--cream);

        <div class="meter-wrap" id="meterWrap">
          <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
          <div class="mic-label" id="micLabel">🎤 blow into your mic…</div>
          <button class="blow-btn" id="blowBtn">hold to blow (or hold spacebar)</button>
        </div>

        <div class="wish-overlay" id="wishOverlay">
          <p>make a wish, naddy 🌟</p>
          <button class="relight-btn" id="relightBtn">relight the candles</button>
        </div>
        <canvas id="confetti"></canvas>
      </div>
    </div>
  </div>

  <button id="backBtn">← back to cover</button>

  <div class="https-note">must be served over https for the mic to work (this page, once published/hosted, is) — if the mic is blocked, just hold the "blow" button or hold the spacebar instead.</div>
</div>

<script>
(function(){
  const coverBtn = document.getElementById('coverBtn');
  const coverWrap = document.getElementById('coverWrap');
  const book = document.getElementById('book');
  const backBtn = document.getElementById('backBtn');
  const titleEl = document.querySelector('.title');

  coverBtn.addEventListener('click', () => {
    coverWrap.style.display = 'none';
    titleEl.style.display = 'none';
    book.classList.add('open');
    backBtn.classList.add('show');
  });
  backBtn.addEventListener('click', () => {
    book.classList.remove('open');
    coverWrap.style.display = '';
    titleEl.style.display = '';
    backBtn.classList.remove('show');
    // reset letter + candles state when returning
    letterBtn.classList.remove('up');
    resetCandles();
  });

  // ---------- Letter interaction ----------
  const letterBtn = document.getElementById('letterBtn');
  const letterHint = document.getElementById('letterHint');
  letterBtn.addEventListener('click', () => {
    const up = letterBtn.classList.toggle('up');
    letterHint.textContent = up ? 'tap to tuck it back in' : 'tap the letter to read it';
  });

  // ---------- Candle / blow-out logic ----------
  const flames = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];
  const meterFill = document.getElementById('meterFill');
  const micLabel = document.getElementById('micLabel');
  const blowBtn = document.getElementById('blowBtn');
  const wishOverlay = document.getElementById('wishOverlay');
  const relightBtn = document.getElementById('relightBtn');

  let litCount = flames.length;
  let blowStart = null;
  let blowing = false;
  let animId = null;
  let audioCtx = null, analyser = null, dataArr = null, micStream = null;
  const BLOW_THRESHOLD = 0.16;     // level 0..1 that counts as "blowing"
  const BLOW_HOLD_MS = 500;        // sustained time to extinguish

  function resetCandles(){
    flames.forEach(f => f.classList.remove('out'));
    flames.forEach(f => f.style.transform = '');
    litCount = flames.length;
    blowStart = null;
    wishOverlay.classList.remove('show');
    meterFill.style.width = '0%';
  }
  relightBtn.addEventListener('click', resetCandles);

  function extinguishNext(level){
    // bend all still-lit flames based on level
    flames.forEach(f => {
      if(!f.classList.contains('out')){
        const bend = Math.min(level * 55, 45);
        f.style.transform = `rotate(${bend}deg) scaleY(${1 - Math.min(level*0.25,0.2)})`;
      }
    });
    if(level > BLOW_THRESHOLD){
      if(blowStart === null) blowStart = performance.now();
      const held = performance.now() - blowStart;
      if(held > BLOW_HOLD_MS){
        // put out one flame at a time, front to back
        const stillLit = flames.filter(f=>!f.classList.contains('out'));
        if(stillLit.length){
          stillLit[0].classList.add('out');
          litCount--;
          blowStart = performance.now(); // reset timer for next candle
        }
        if(litCount <= 0){
          celebrate();
        }
      }
    } else {
      blowStart = null;
    }
  }

  function celebrate(){
    wishOverlay.classList.add('show');
    launchConfetti();
  }

  function setLevel(level){
    meterFill.style.width = Math.min(level*100/0.5, 100) + '%';
    if(litCount > 0) extinguishNext(level);
  }

  // --- Mic path ---
  async function startMic(){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
      src.connect(analyser);
      dataArr = new Uint8Array(analyser.frequencyBinCount);
      micLabel.textContent = '🎤 listening… blow now!';
      tickMic();
    } catch(err){
      micLabel.textContent = '🎤 mic blocked — use the button below instead';
    }
  }

  function tickMic(){
    animId = requestAnimationFrame(tickMic);
    if(!analyser) return;
    analyser.getByteTimeDomainData(dataArr);
    let sum = 0;
    for(let i=0;i<dataArr.length;i++){
      const v = (dataArr[i]-128)/128;
      sum += v*v;
    }
    const rms = Math.sqrt(sum/dataArr.length); // 0..~1
    setLevel(rms);
  }

  // --- Fallback: hold button or spacebar ---
  let holdInterval = null;
  function holdStart(){
    if(blowing) return;
    blowing = true;
    let level = 0;
    holdInterval = setInterval(()=>{
      level = Math.min(level + 0.08, 0.5);
      setLevel(level);
    }, 40);
  }
  function holdEnd(){
    blowing = false;
    clearInterval(holdInterval);
    blowStart = null;
    setLevel(0);
  }
  blowBtn.addEventListener('mousedown', holdStart);
  blowBtn.addEventListener('touchstart', (e)=>{e.preventDefault();holdStart();}, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>blowBtn.addEventListener(ev, holdEnd));

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' && book.classList.contains('open')){
      e.preventDefault();
      holdStart();
    }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code === 'Space'){ holdEnd(); }
  });

  // start mic once the book is opened (first time) — try automatically, fine if it fails
  let micTried = false;
  coverBtn.addEventListener('click', () => {
    if(!micTried){ micTried = true; startMic(); }
  });

  // ---------- Confetti ----------
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);

  function launchConfetti(){
    resizeCanvas();
    const colors = ['#e8743b','#f6c453','#8b2635','#767b39','#fdfbf3'];
    confettiPieces = [];
    for(let i=0;i<80;i++){
      confettiPieces.push({
        x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.5,
        w: 5+Math.random()*5,
        h: 8+Math.random()*6,
        color: colors[Math.floor(Math.random()*colors.length)],
        vy: 1.5+Math.random()*2.5,
        vx: -1+Math.random()*2,
        rot: Math.random()*360,
        vr: -6+Math.random()*12
      });
    }
    let frames = 0;
    function frame(){
      frames++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      confettiPieces.forEach(p=>{
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      });
      if(frames < 260){ requestAnimationFrame(frame); }
      else { ctx.clearRect(0,0,canvas.width,canvas.height); }
    }
    frame();
  }
})();
</script>
</body>
